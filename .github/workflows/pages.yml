# Static-site deployment.
#
# The build is entirely client-side: no Python runs on Pages, so `web/` is
# compiled with `--mode static`, which selects the in-browser inference path
# instead of the FastAPI one. The FastAPI server is untouched and still runs
# locally via `make dev`.
#
# Two things here are load-bearing and easy to break:
#
# * VITE_BASE. This is a project site served from /age-estimator/, not from the
#   domain root, so every asset URL has to carry that prefix. Vite's default of
#   "/" produces a page that loads and then 404s on its own JavaScript.
#
# * web/public/models/models.json is committed, not generated here. Generating
#   it means verifying that each ONNX export really is the checkpoint whose
#   accuracy figures it is about to carry, which needs torch. Installing a
#   deep-learning stack on every deploy to re-derive a 5 KB file is a bad
#   trade; server/tests/test_static_registry.py fails if the committed copy has
#   drifted from server/.
#
# TWO PUBLISH PATHS, AND WHY
#
# actions/deploy-pages is the intended mechanism and the one to keep. It only
# works when the repository's Pages source is set to "GitHub Actions": that
# setting is what makes GitHub widen the auto-managed `github-pages`
# environment's branch policy to include the default branch. While the source
# is a branch, the policy allows only that branch, and a deploy from `master`
# is rejected with "not allowed to deploy to github-pages due to environment
# protection rules" -- after a successful build, which makes it look like a
# build problem.
#
# Changing that setting needs repository admin. So rather than leave the
# workflow red until someone with admin clicks it, the deploy step is chosen
# from what the Pages API actually reports:
#
#   build_type == "workflow"  -> actions/deploy-pages (the good path)
#   build_type == "legacy"    -> push web/dist to the configured branch
#
# The second is a fallback, not a design. Flip
# Settings -> Pages -> Source to "GitHub Actions" and it stops running by
# itself, with nothing to remove here.

name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  # `contents: write` is only for the legacy-source fallback below, which has
  # to push the built site to a branch. The deploy-pages path does not use it.
  contents: write
  pages: write
  id-token: write

# Let a run in progress finish rather than cancelling it: a half-deployed
# static site is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Build
        working-directory: web
        env:
          # Project site, not a user site. Without this the deployed page loads
          # and then fails to find any of its own assets.
          VITE_BASE: /age-estimator/
        run: npm run build:static

      - name: Check the build has its models
        working-directory: web
        run: |
          set -euo pipefail
          # dist/ is committed verbatim by the branch-publish fallback below, so
          # a stray .gitignore copied out of public/ would filter the whole
          # deployment. It has done exactly that once.
          test ! -e dist/.gitignore || { echo "dist/.gitignore must not exist" >&2; exit 1; }
          for f in dist/index.html \
                   dist/parity.html \
                   dist/models/models.json \
                   dist/models/age_model_realgt.onnx \
                   dist/models/age_model.onnx \
                   dist/models/face_detection_yunet_2023mar.dynamic.onnx \
                   dist/ort/ort-wasm-simd-threaded.wasm \
                   dist/ort/ort-wasm-simd-threaded.mjs; do
            test -s "$f" || { echo "missing or empty: $f" >&2; exit 1; }
          done
          # A truncated model would deploy happily and only fail in a browser.
          node -e '
            const fs = require("node:fs");
            const registry = JSON.parse(fs.readFileSync("dist/models/models.json", "utf8"));
            for (const model of registry.models) {
              if (!model.asset) continue;
              const size = fs.statSync(`dist/models/${model.asset}`).size;
              if (size !== model.bytes) {
                throw new Error(`${model.asset}: ${size} bytes, models.json says ${model.bytes}`);
              }
            }
            console.log("model assets match models.json");
          '

      # `enablement` turns Pages on if it is off, so a fresh clone of this repo
      # deploys without a manual settings step. It needs administration rights
      # that GITHUB_TOKEN does not always have -- on this repository it fails
      # with "Resource not accessible by integration" -- so it is allowed to
      # fail. The publish step below reads the real state from the API either
      # way, and a genuinely unconfigured site fails there with a clearer
      # message than this action gives.
      - uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

      # Which publish path can actually succeed. See the note at the top.
      - id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          info=$(gh api "repos/${{ github.repository }}/pages" 2>/dev/null || echo '{}')
          if [ "$info" = '{}' ]; then
            echo "::error::GitHub Pages is not configured for this repository, and this workflow's token cannot enable it. Enable it once under Settings -> Pages (Source: GitHub Actions)."
            exit 1
          fi
          build_type=$(echo "$info" | jq -r '.build_type // "none"')
          branch=$(echo "$info" | jq -r '.source.branch // "gh-pages"')
          echo "build_type=$build_type" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "Pages build_type=$build_type source branch=$branch"

      - name: Publish to the Pages source branch (legacy source only)
        if: steps.pages.outputs.build_type != 'workflow'
        env:
          BRANCH: ${{ steps.pages.outputs.branch }}
        run: |
          set -euo pipefail
          echo "::warning::Pages source is the '$BRANCH' branch rather than GitHub Actions, so this run published to that branch instead of using actions/deploy-pages. Set Settings -> Pages -> Source to 'GitHub Actions' (needs repository admin) and this step stops running by itself."
          # Jekyll would otherwise drop any path beginning with an underscore.
          touch web/dist/.nojekyll
          cd web/dist
          git init -q -b "$BRANCH"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${{ github.sha }}"
          git push -q --force \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" \
            "HEAD:refs/heads/$BRANCH"

    outputs:
      build_type: ${{ steps.pages.outputs.build_type }}

  deploy:
    needs: build
    if: needs.build.outputs.build_type == 'workflow'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
